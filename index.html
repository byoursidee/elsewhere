<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>Elsewhere — Living Windows</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07141e;color:white;font-family:system-ui,Arial;overflow:hidden}button,select,input{font:inherit;color:inherit}button{cursor:pointer}.stage{display:flex;width:100vw;height:100dvh}.stage.vertical{flex-direction:column}.window{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:#13283c}.photo{background-color:#1b3848;position:absolute;inset:-6%;background-position:center;background-size:cover;animation:float 30s ease-in-out infinite alternate;transition:opacity .6s;will-change:transform}.window:nth-child(even) .photo{animation-direction:alternate-reverse}@keyframes float{to{transform:scale(1.14) translate(1.4%,-1.2%)}}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#051626b8,#04172722 85%),linear-gradient(0deg,#05121ca9,transparent 60%)}.glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.22;background:radial-gradient(ellipse at 76% 20%,#ffb95b80,transparent 48%);animation:glimmer 9s ease-in-out infinite alternate}@keyframes glimmer{to{opacity:.45;transform:translateY(2%)}}.window.night .glow{background:radial-gradient(ellipse at 75% 12%,#789cdd70,transparent 48%)}.content{position:absolute;inset:0;padding:clamp(22px,3.4vw,55px);display:flex;flex-direction:column;justify-content:center;text-shadow:0 2px 24px #001c}.label{font-size:clamp(11px,1.1vw,14px);letter-spacing:.26em;text-transform:uppercase;color:#ffe4bd}.clock{font-size:clamp(54px,9vw,152px);line-height:1.05;font-weight:200;letter-spacing:-.065em;white-space:nowrap}.city{font:clamp(24px,2.8vw,42px) Georgia,serif;margin-top:10px}.phase{font:clamp(34px,5vw,76px)/1.08 Georgia,serif;letter-spacing:-.035em;opacity:1;margin:0 0 16px;max-width:850px;text-wrap:balance}.window.multi .clock{font-size:clamp(32px,5vw,100px)}.window.multi .city{font-size:clamp(18px,2vw,32px)}.window.multi .phase{font-size:clamp(26px,3vw,51px);margin-bottom:12px}.stage.vertical .window.multi .content{padding:18px 5vw}.stage.vertical .window.multi .clock{font-size:clamp(26px,5vh,70px)}.stage.vertical .window.multi .city{font-size:clamp(15px,2vh,24px);margin-top:3px}.stage.vertical .window.multi .phase{font-size:clamp(21px,3.8vh,42px);margin:0 0 8px}.top{position:fixed;z-index:10;top:22px;left:clamp(20px,3vw,50px);font:26px Georgia,serif;text-shadow:0 2px 15px #000}.top span{color:#ffd5a1}.home{position:fixed;z-index:10;top:20px;right:24px;text-align:right;padding:12px 17px;border:1px solid #ffffff42;border-radius:14px;background:#071b2a77;backdrop-filter:blur(14px)}.home small{display:block;font-size:10px;letter-spacing:.13em;opacity:.85}.home strong{font-size:20px;font-weight:400}.toolbar{position:fixed;z-index:11;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:7px;max-width:calc(100vw - 130px);overflow:auto;padding:7px;border:1px solid #ffffff55;background:#071d2b9c;backdrop-filter:blur(20px);border-radius:28px;scrollbar-width:none}.toolbar button,.floating,.panel button{background:#ffffff18;border:1px solid #ffffff40;border-radius:22px;padding:11px 15px;white-space:nowrap}.toolbar button:hover,.floating:hover,.panel button:hover{background:#ffffff36}.toolbar button.active{background:#ffffff45}.controls{position:fixed;z-index:12;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px}.floating{width:47px;height:47px;font-size:21px;padding:0;background:#071d2b9c;backdrop-filter:blur(18px)}.panel{position:fixed;z-index:20;right:20px;bottom:133px;width:min(350px,calc(100vw - 40px));padding:23px;border:1px solid #ffffff55;background:#071a2bec;backdrop-filter:blur(25px);border-radius:20px;box-shadow:0 15px 55px #0009;display:none}.panel.open{display:block}.panel h2{font:25px Georgia,serif;margin:0 0 18px}.panel label{display:block;margin:15px 0 6px;font-size:13px}.panel select,.panel input{width:100%;background:#18364b;border:1px solid #ffffff66;border-radius:10px;padding:11px}.panel .row{display:flex;gap:8px;margin-top:14px}.panel .row button{flex:1}.panel p{font-size:12px;opacity:.75;line-height:1.5}.divider{position:absolute;z-index:3;right:0;top:0;height:100%;width:1px;background:#ffffff55}.stage.vertical .divider{height:1px;width:100%;top:auto;bottom:0}.remove{position:absolute;right:12px;top:50%;z-index:4;border:0;background:#081a2a80;border-radius:100%;width:28px;height:28px;opacity:.7}.remove:hover{opacity:1}.font-classic .clock{font-family:Georgia,serif;font-weight:400;letter-spacing:-.05em}.font-mono .clock{font-family:ui-monospace,monospace;letter-spacing:-.09em}.font-rounded .clock{font-family:"Trebuchet MS",system-ui,sans-serif;font-weight:500}.font-modern .clock{font-family:system-ui,sans-serif}@media(max-width:700px){.stage:not(.vertical).multi-stage{flex-direction:column}.stage:not(.vertical).multi-stage .divider{height:1px;width:100%;top:auto;bottom:0}.stage:not(.vertical).multi-stage .clock{font-size:clamp(28px,6vh,65px)}.stage:not(.vertical).multi-stage .content{padding:16px 25px}.top{font-size:20px}.home strong{font-size:16px}.toolbar{left:14px;transform:none;max-width:calc(100vw - 92px)}.stage:not(.vertical).multi-stage .city{font-size:20px;margin-top:4px}.stage:not(.vertical).multi-stage .phase{font-size:clamp(24px,4vh,38px);margin-bottom:6px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v9: layout priority, city-colored location chips and flowing hover fill */
.stage.multi-stage.vertical{flex-direction:column!important}
.stage.multi-stage:not(.vertical){flex-direction:row!important}
@media(max-width:700px){.stage.multi-stage:not(.vertical){flex-direction:row!important}.stage.multi-stage:not(.vertical) .window.multi .content{padding:12px}.stage.multi-stage:not(.vertical) .window.multi .clock{font-size:clamp(15px,3vw,32px)}.stage.multi-stage:not(.vertical) .window.multi .phase{font-size:clamp(13px,2.4vw,24px)}.stage.multi-stage:not(.vertical) .window.multi .city{font-size:clamp(12px,2vw,22px)}}
.toolbar button{position:relative;isolation:isolate;overflow:hidden;flex-shrink:0;border:1.5px solid var(--chip,#a7c4d7);background:color-mix(in srgb,var(--chip,#a7c4d7) 12%,#091a29 88%);color:#fff;box-shadow:inset 0 0 0 1px #ffffff12,0 0 14px color-mix(in srgb,var(--chip,#a7c4d7) 12%,transparent);transition:box-shadow .35s,border-color .35s,transform .35s}
.toolbar button::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 0%,var(--chip,#a7c4d7) 46%,color-mix(in srgb,var(--chip,#a7c4d7) 55%,#fff) 65%,var(--chip,#a7c4d7) 100%);transform:translateX(-110%);transition:transform .55s cubic-bezier(.22,1,.36,1);opacity:.8}
.toolbar button:hover::before,.toolbar button:focus-visible::before{transform:translateX(0)}
.toolbar button:hover{transform:translateY(-2px);border-color:var(--chip,#fff);box-shadow:0 0 22px color-mix(in srgb,var(--chip,#a7c4d7) 30%,transparent)}
.toolbar button.active{border-color:var(--chip,#fff);box-shadow:0 0 16px color-mix(in srgb,var(--chip,#a7c4d7) 40%,transparent)}
.window .photo{background-repeat:no-repeat;background-size:cover}

.toolbar button{--chip:#fff!important;background:#f7f8f9!important;color:#0b1117!important;border:1.5px solid #fff!important;box-shadow:0 4px 20px #0005!important;transition:color .32s,transform .32s,box-shadow .32s!important;position:relative;isolation:isolate;overflow:hidden}
.toolbar button::before{content:"";position:absolute;z-index:-1;left:-30%;top:110%;width:160%;height:210%;background:#080c11;border-radius:44% 56% 0 0 / 13% 18% 0 0;transform:rotate(-4deg);transition:top .7s cubic-bezier(.22,.75,.2,1),border-radius .7s,transform .7s;opacity:1}
.toolbar button::after{content:"";position:absolute;z-index:-1;left:-15%;top:115%;width:130%;height:40%;border-radius:48% 52% 0 0;background:#20262b;opacity:.75;transform:rotate(8deg);transition:top .8s cubic-bezier(.22,.75,.2,1)}
.toolbar button:hover::before,.toolbar button:focus-visible::before,.toolbar button.active::before{top:-22%;border-radius:42% 58% 0 0 / 9% 12% 0 0;transform:rotate(2deg)}
.toolbar button:hover::after,.toolbar button:focus-visible::after,.toolbar button.active::after{top:-26%}
.toolbar button:hover,.toolbar button:focus-visible,.toolbar button.active{color:#fff!important;transform:translateY(-2px);box-shadow:0 7px 24px #0009!important}
.location-results{max-height:185px;overflow-y:auto;margin-top:7px;border-radius:12px;display:none;background:#102738;border:1px solid #ffffff33}
.location-results.open{display:block}
.location-results button{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-bottom:1px solid #ffffff19;border-radius:0;text-align:left;background:transparent;color:#fff;padding:10px 12px;white-space:normal}
.location-results button:hover,.location-results button:focus-visible{background:#ffffff25}

.window .photo{inset:0!important;transform:none!important;animation:none!important;background-repeat:no-repeat}
.window.multi .photo{min-width:0;min-height:0}
.window.multi .shade{background:linear-gradient(90deg,#05162695,#0417270b 95%),linear-gradient(0deg,#05121c9a,transparent 65%)}
.stage.multi-stage.vertical .window{min-height:0;flex:1 1 0}
.stage.multi-stage:not(.vertical) .window{min-width:0;flex:1 1 0}

.window.multi .photo{background-size:cover,cover;filter:saturate(1.08)}
.window.multi .shade{pointer-events:none}
.atmosphere{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 18% 86%,#f1874e99 0%,#f4b06d66 28%,transparent 70%),linear-gradient(125deg,#f5c98b36 0%,transparent 58%);filter:saturate(.5) brightness(1.05);transition:opacity 4s ease,filter 4s ease;mix-blend-mode:soft-light}
.window.light-dawn .atmosphere{opacity:.72;filter:hue-rotate(-8deg) saturate(1.4) brightness(1.12)}
.window.light-morning .atmosphere{opacity:.5;filter:saturate(.9) brightness(1.1)}
.window.light-midday .atmosphere{opacity:.38;filter:hue-rotate(12deg) saturate(.45) brightness(1.2)}
.window.light-afternoon .atmosphere{opacity:.55;filter:hue-rotate(-5deg) saturate(1) brightness(1.02)}
.window.light-golden .atmosphere{opacity:.82;filter:hue-rotate(-12deg) saturate(1.5) brightness(1.08)}
.window.light-dusk .atmosphere{opacity:.78;filter:hue-rotate(185deg) saturate(1.35) brightness(.82)}
.window.light-night .atmosphere{opacity:.72;filter:hue-rotate(198deg) saturate(1.25) brightness(.48)}

</style></head><body><div id="stage" class="stage"></div><div class="top">Elsewhere<span>.</span></div><div class="home"><small>YOUR TIME · DHAKA</small><strong id="homeTime"></strong></div><nav id="toolbar" class="toolbar"></nav><div class="controls"><button id="viewBtn" class="floating" title="Multi-view" aria-label="Multi-view">▦</button><button id="settingsBtn" class="floating" title="Settings" aria-label="Settings">⚙</button></div><section id="panel" class="panel"><h2>Atmosphere settings</h2><label for="scene">Visual world</label><select id="scene"><option value="auto">Automatic · local time</option><option value="forest">Forest</option><option value="mountain">Mountain</option><option value="ocean">Ocean</option><option value="city">City skyline</option><option value="desert">Desert</option><option value="lake">Lakeside</option><option value="aurora">Northern lights</option><option value="rain">Rainy streets</option></select><label for="font">Clock font</label><select id="font"><option value="modern">Modern</option><option value="classic">Classic serif</option><option value="mono">Monospace</option><option value="rounded">Rounded</option></select><label for="layout">Multi-view direction</label><select id="layout"><option value="horizontal">Side by side</option><option value="vertical">Stacked vertically</option></select><label for="locationSearch">Search location</label><input id="locationSearch" type="search" placeholder="Search cities or time zones…" autocomplete="off" aria-label="Search locations"><div id="locationResults" class="location-results" role="listbox"></div><label for="addCity">Quick location (up to five)</label><select id="addCity"></select><div class="row"><button id="addBtn">Add location</button><button id="closeBtn">Close</button></div><p>Photographic scenes use internet-hosted images. Motion and daylight are artistic interpretations, not live camera feeds.</p></section>
<script>
const places={Dhaka:'Asia/Dhaka',Tokyo:'Asia/Tokyo',London:'Europe/London','New York':'America/New_York',Paris:'Europe/Paris',Sydney:'Australia/Sydney',Dubai:'Asia/Dubai',Singapore:'Asia/Singapore',Toronto:'America/Toronto',Seoul:'Asia/Seoul',Berlin:'Europe/Berlin'};
const photos={forest:'photo-1448375240586-882707db888b',mountain:'photo-1464822759023-fed622ff2c3b',ocean:'photo-1507525428034-b723cf961d3e',city:'photo-1519501025264-65ba15a82390',desert:'photo-1509316785289-025f5b846b35',lake:'photo-1470770841072-f978cf4d019e',aurora:'photo-1531366936337-7c912a4589a7',rain:'photo-1519608487953-e999c86e7455'};
const $=id=>document.getElementById(id);
let active='Dhaka',selected=['Dhaka','Tokyo','London'],multi=false,scene='auto',font='modern',layout='horizontal';
const format=(tz,options)=>new Intl.DateTimeFormat('en-US',{timeZone:tz,...options}).format(new Date());
const hour=tz=>+format(tz,{hour:'2-digit',hourCycle:'h23'});
function phase(h){return h<5?"It's late at night here":h<7?"It's dawn here":h<12?"It's morning here":h<17?"It's afternoon here":h<19?"It's golden hour here":"It's evening here"}
function lightPhase(h){return h<5||h>=21?'night':h<7?'dawn':h<11?'morning':h<15?'midday':h<17?'afternoon':h<19?'golden':'dusk'}
function sceneFor(city){if(scene!=='auto')return scene;let h=hour(places[city]);return h<5||h>=20?'aurora':city==='Tokyo'||city==='New York'||city==='London'?'city':h<8?'mountain':'forest'}
const sceneColors={
forest:'linear-gradient(160deg,#4d876b 0%,#244e47 42%,#071e20 100%)',
mountain:'linear-gradient(155deg,#88b2c9 0%,#587b8c 38%,#1b3445 74%,#0c1e2c 100%)',
ocean:'linear-gradient(180deg,#73b6cb 0%,#d9b28b 48%,#14627d 52%,#082f49 100%)',
city:'linear-gradient(165deg,#394c72 0%,#bd795f 48%,#132039 100%)',
desert:'linear-gradient(175deg,#efc58a 0%,#d78b57 48%,#774d39 100%)',
lake:'linear-gradient(180deg,#8caec2 0%,#658e9a 48%,#2b6b79 51%,#183d53 100%)',
aurora:'linear-gradient(155deg,#04132d 0%,#226e73 40%,#172a58 70%,#060d23 100%)',
rain:'linear-gradient(170deg,#34445c 0%,#506779 48%,#142638 100%)'
};
function photoFor(city){return `https://images.unsplash.com/${photos[sceneFor(city)]}?w=1920&q=85`}
function vectorScene(city){
 const kind=sceneFor(city),h=hour(places[city]),night=h<6||h>=19;
 const palette={
 forest:['#183b43','#477b70','#0c302e'],mountain:['#213957','#83a8ba','#152f4b'],
 ocean:['#285d79','#a6c6c2','#124e69'],city:['#16253f','#6884a4','#0c1a34'],
 desert:['#a85f4a','#e8bb80','#a86849'],lake:['#3b7381','#b4d0c4','#1a5663'],
 aurora:['#061330','#1c5571','#07132a'],rain:['#1b2d42','#536b81','#0c1c2e']
 }[kind];
 const sky=night?['#061027','#172947','#091a34']:palette;
 const stars=night?Array.from({length:42},(_,i)=>`<circle cx="${(i*137+47)%1200}" cy="${(i*79+31)%380}" r="${i%3+1}" fill="#fff" opacity=".55"/>`).join(''):'';
 const sun=`<circle cx="650" cy="220" r="${night?35:70}" fill="${night?'#e3e9ff':'#ffe4a2'}" opacity=".88"/><circle cx="650" cy="220" r="${night?65:120}" fill="${night?'#b9c9ff':'#ffe7b0'}" opacity=".13"/>`;
 const landscape={
 forest:`<path d="M0 560L100 440 190 560 310 360 430 560 550 390 710 560 900 400 1050 560 1200 440V800H0Z" fill="#163c36"/><path d="M0 690L90 490 160 690 280 450 400 690 540 420 660 690 800 470 940 690 1080 420 1200 690V800H0Z" fill="#092c2d"/>`,
 mountain:`<path d="M0 650L300 230 480 480 700 170 990 540 1110 310 1200 480V800H0Z" fill="#46677a"/><path d="M195 375L300 230 405 375 340 349 300 305 265 357Z M605 300L700 170 790 305 742 278 700 231 665 290Z" fill="#e4eef2"/><path d="M0 720L400 520 700 680 1040 480 1200 610V800H0Z" fill="#163b4e"/>`,
 ocean:`<path d="M0 470Q200 455 400 472T800 470T1200 475V800H0Z" fill="#176d86"/><path d="M0 570Q140 540 280 565T560 560T850 570T1200 558" fill="none" stroke="#d9f1e8" stroke-width="9" opacity=".6"/><path d="M0 700Q160 660 320 690T700 688T1200 700" fill="none" stroke="#c9e7e5" stroke-width="12" opacity=".3"/>`,
 city:`<path d="M0 800V490H80V390H170V570H240V320H350V500H420V260H510V530H590V350H710V540H780V300H890V530H960V400H1050V550H1130V350H1200V800Z" fill="#14273e"/><path d="M35 540h20m65-95h20m150-65h20m150-40h20m175 65h20m170-45h20m190 100h20" stroke="#f5c886" stroke-width="11" stroke-dasharray="10 25"/>`,
 desert:`<path d="M0 610Q250 350 540 560T1200 490V800H0Z" fill="#c98c5d"/><path d="M0 700Q250 510 600 670T1200 580V800H0Z" fill="#9f604a"/><path d="M0 780Q260 630 650 740T1200 660V800H0Z" fill="#794b43"/>`,
 lake:`<path d="M0 510L170 320 350 500 550 280 800 520 1020 330 1200 500V800H0Z" fill="#365f68"/><path d="M0 535H1200V800H0Z" fill="#276b7a"/><path d="M0 640Q230 620 480 645T1000 640T1200 650M0 720Q280 705 550 728T1200 720" fill="none" stroke="#b7d7c9" stroke-width="7" opacity=".35"/>`,
 aurora:`<path d="M-100 250Q300 -50 650 160T1300 60" fill="none" stroke="#5be4b0" stroke-width="100" opacity=".34"/><path d="M-100 200Q350 0 720 230T1300 100" fill="none" stroke="#80b8f0" stroke-width="65" opacity=".22"/><path d="M0 680L150 540 270 660 440 490 600 650 790 520 990 690 1200 540V800H0Z" fill="#081c2c"/>`,
 rain:`<path d="M0 800V450H110V350H220V570H330V290H460V480H550V390H660V540H780V310H900V480H1040V360H1200V800Z" fill="#15283d"/><path d="${Array.from({length:38},(_,i)=>`M${i*36} 0l-130 800`).join(' ')}" stroke="#c4e1f1" stroke-width="3" opacity=".22"/>`
 }[kind];
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="${sky[0]}"/><stop offset=".65" stop-color="${sky[1]}"/><stop offset="1" stop-color="${sky[2]}"/></linearGradient></defs><path fill="url(#sky)" d="M0 0h1200v800H0z"/>${stars}${sun}${landscape}</svg>`;
 return 'url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
}
function applyPhoto(img,city){
const key=sceneFor(city),url=photoFor(city);
img.style.backgroundImage=`${vectorScene(city)},${sceneColors[key]}`;
img.style.backgroundSize='cover,cover';
img.style.backgroundPosition='65% 35%,center';
img.style.backgroundRepeat='no-repeat,no-repeat';
img.dataset.url=url;
const request=(img.dataset.request=String((Number(img.dataset.request)||0)+1));
const test=new Image();
test.onload=()=>{if(img.isConnected&&img.dataset.request===request)img.style.backgroundImage=`linear-gradient(90deg,#04152155,#04152108),url("${url}")`;img.style.backgroundSize='cover,cover';img.style.backgroundPosition='65% 35%,center';img.style.backgroundRepeat='no-repeat,no-repeat'};
test.onerror=()=>{if(img.dataset.request===request)img.style.backgroundImage=`${vectorScene(city)},${sceneColors[key]}`;
img.style.backgroundSize='cover,cover';
img.style.backgroundPosition='65% 35%,center';
img.style.backgroundRepeat='no-repeat,no-repeat'};
test.src=url;
}
function updateClocks(){$('homeTime').textContent=format(places.Dhaka,{hour:'numeric',minute:'2-digit',hour12:true});document.querySelectorAll('.window').forEach(w=>{let city=w.dataset.city,h=hour(places[city]),light=lightPhase(h);w.querySelector('.clock').textContent=format(places[city],{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});w.querySelector('.phase').textContent=phase(h);w.classList.toggle('night',h<6||h>=19);if(w.dataset.light!==light){w.classList.remove(...['dawn','morning','midday','afternoon','golden','dusk','night'].map(x=>'light-'+x));w.classList.add('light-'+light);w.dataset.light=light}{let img=w.querySelector('.photo'),url=photoFor(city);if(img.dataset.url!==url){applyPhoto(img,city)}}})}
function render(){let list=multi?selected:[active];$('stage').className='stage '+(multi?'multi-stage ':'')+(multi&&layout==='vertical'?'vertical':'');$('stage').innerHTML='';list.forEach((city,i)=>{let w=document.createElement('article');w.className='window '+(multi?'multi':'');w.dataset.city=city;w.innerHTML=`<div class="photo"></div><div class="atmosphere" aria-hidden="true"></div><div class="glow"></div><div class="shade"></div><div class="content"><div class="label">${city==='Dhaka'?'YOUR WORLD':'A WINDOW INTO TIME'}</div><div class="phase"></div><div class="clock"></div><div class="city"></div></div>${multi&&list.length>1?'<button class="remove" title="Remove location" aria-label="Remove location">×</button>':''}${i<list.length-1?'<div class="divider"></div>':''}`;w.querySelector('.city').textContent=city;let img=w.querySelector('.photo');if(multi&&list.length>1)w.querySelector('.remove').onclick=()=>{selected=selected.filter(x=>x!==city);render()};$('stage').appendChild(w);applyPhoto(img,city)});document.body.className='font-'+font;renderNav();updateClocks()}
const cityColors={Dhaka:'#e9b96d',Tokyo:'#ef8ea7',London:'#9ebff0','New York':'#9dd6c6',Paris:'#d8aaf0',Sydney:'#79cbe2',Dubai:'#e7b274',Singapore:'#89d6b0',Toronto:'#eaa3a3',Seoul:'#b2a5ed',Berlin:'#c6d3ec'};
function renderNav(){$('toolbar').innerHTML='';(multi?selected:Object.keys(places).slice(0,4)).forEach(city=>{let b=document.createElement('button');b.textContent='⌖ '+city;b.className=!multi&&active===city?'active':'';b.onclick=()=>{if(!multi){active=city;render()}else{active=city;multi=false;render()}};$('toolbar').appendChild(b)});if(!multi){let b=document.createElement('button');b.textContent='⌖ More places';b.onclick=()=>{$('panel').classList.add('open');$('addCity').focus()};$('toolbar').appendChild(b)}}
Object.keys(places).forEach(city=>{let o=document.createElement('option');o.value=city;o.textContent=city;$('addCity').appendChild(o)});
$('viewBtn').onclick=()=>{multi=!multi;if(multi&&!selected.includes(active)){selected=[active,...selected.filter(x=>x!==active)].slice(0,5)};render()};
$('settingsBtn').onclick=()=>$('panel').classList.toggle('open');
$('closeBtn').onclick=()=>$('panel').classList.remove('open');
$('scene').onchange=e=>{scene=e.target.value;render()};
$('font').onchange=e=>{font=e.target.value;document.body.className='font-'+font};

['Mumbai','Asia/Kolkata'],['Delhi','Asia/Kolkata'],['New Delhi','Asia/Kolkata'],['Kolkata','Asia/Kolkata'],['Bengaluru','Asia/Kolkata'],['Chennai','Asia/Kolkata'],['Hyderabad','Asia/Kolkata'],
['Kathmandu','Asia/Kathmandu'],['Karachi','Asia/Karachi'],['Lahore','Asia/Karachi'],['Islamabad','Asia/Karachi'],['Colombo','Asia/Colombo'],

const zoneNames=(()=>{
 let zones=[];
 try{zones=Intl.supportedValuesOf('timeZone')}catch(e){zones=Object.values(places)}
 return [...cityCatalog.map(([name,zone])=>({name,zone,region:zone.replaceAll('_',' ')})),...Object.entries(places).map(([name,zone])=>({name,zone,region:zone.replaceAll('_',' ')})),...[...new Set(zones)].map(zone=>({zone,name:zone.split('/').pop().replace(/_/g,' '),region:zone.split('/').slice(0,-1).join(' / ').replace(/_/g,' ')}))];
})();
function searchLocations(){
 const q=$('locationSearch').value.trim().toLowerCase(),results=$('locationResults');
 results.innerHTML='';
 if(!q){results.innerHTML='';for(const name of ['Dhaka','Tokyo','London','New York','Paris','Dubai']){const b=document.createElement('button');b.type='button';b.textContent=name;b.onclick=()=>{const z=zoneNames.find(x=>x.name===name);$('locationSearch').value=name;searchLocations();const match=[...results.querySelectorAll('button')].find(x=>x.querySelector('span')?.textContent===name);if(match)match.click()};results.appendChild(b)}results.classList.add('open');return}
 const found=zoneNames.filter(z=>`${z.name} ${z.region} ${z.zone}`.toLowerCase().includes(q)).sort((a,b)=>{
 const score=z=>z.name.toLowerCase()===q?0:z.name.toLowerCase().startsWith(q)?1:z.name.toLowerCase().includes(q)?2:3;
 return score(a)-score(b)||a.name.localeCompare(b.name)
 }).filter((z,i,all)=>all.findIndex(v=>v.name===z.name)===i).slice(0,12);
 if(!found.length){results.classList.remove('open');return}
 for(const z of found){
  const b=document.createElement('button');b.type='button';
  const name=document.createElement('span');name.textContent=z.name;
  const region=document.createElement('small');region.textContent=z.region;
  b.append(name,region);
  b.onclick=()=>{
   let name=z.name;
   if(places[name]&&places[name]!==z.zone)name=z.name+' ('+z.region+')';
   places[name]=z.zone;
   if(![...$('addCity').options].some(o=>o.value===name)){
    const o=document.createElement('option');o.value=name;o.textContent=name;$('addCity').appendChild(o)
   }
   $('addCity').value=name;
   $('locationSearch').value=name;results.classList.remove('open');
   if(multi){if(!selected.includes(name)&&selected.length<5)selected.push(name)}
   else{active=name}
   render();
  };
  results.appendChild(b);
 }
 results.classList.add('open');
}
$('locationSearch').addEventListener('input',searchLocations);
$('locationSearch').addEventListener('focus',searchLocations);
$('locationSearch').addEventListener('keydown',e=>{
 if(e.key==='Enter'){
  const first=$('locationResults').querySelector('button');
  if(first){e.preventDefault();first.click()}
 }
 if(e.key==='Escape')$('locationResults').classList.remove('open')
});
